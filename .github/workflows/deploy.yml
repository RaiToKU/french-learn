name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法与语料自检
        run: |
          set -e
          for f in js/*.js; do node --check "$f"; done
          node - <<'NODE'
          global.window = global;
          ['data/lexicon-meta.js','data/lexicon-a1.js','data/lexicon-a2.js',
           'data/lexicon-b1.js','data/lexicon-b2.js','data/lexicon-c1.js','data/lexicon-ext.js',
           'data/lex-detail.js','data/verb-forms.js','data/verb-tenses.js',
           'data/grammar.js','data/verbs.js','data/frames.js','data/readings.js',
           'data/scenarios.js'].forEach(f => require('./' + f));
          const lx = Object.values(FR.LEXICON).reduce((a, b) => a + b.length, 0);
          const levels = Object.keys(FR.LEXICON).sort().join(',');
          console.log('levels', levels);
          const verbs = Object.keys(FR.VERB_FORMS || {}).length;
          console.log('verb-forms', verbs);
          if (levels !== 'A1,A2,B1,B2,C1') { console.error('分级文件缺失'); process.exit(1); }
          if (verbs < 1000) { console.error('变位池太小'); process.exit(1); }
          // meta 与真实文件必须一致（首屏展示的就是 meta）
          const meta = FR.LEXICON_META || {};
          const metaLevels = Object.keys(meta.levels || {}).sort().join(',');
          const metaSum = Object.values(meta.levels || {}).reduce((a, b) => a + b, 0);
          if (metaLevels !== levels) { console.error('meta.levels 与文件不一致', metaLevels, levels); process.exit(1); }
          if (metaSum !== lx || meta.total !== lx) { console.error('meta 总量不一致', metaSum, meta.total, lx); process.exit(1); }
          if (meta.verbs !== verbs) { console.error('meta.verbs 不一致', meta.verbs, verbs); process.exit(1); }
          // 扩展词表：条数够、字段齐、meta 对得上
          const ext = FR.LEXICON.EXT || [];
          if (ext.length < 1500) { console.error('扩展词表太少', ext.length); process.exit(1); }
          if (meta.ext !== ext.length) { console.error('meta.ext 不一致', meta.ext, ext.length); process.exit(1); }
          if (meta.totalAll !== meta.total + ext.length) { console.error('meta.totalAll 不一致'); process.exit(1); }
          const extDirty = ext.filter(e => !e.w || !e.p || !e.cn).length;
          if (extDirty) { console.error('扩展词条字段缺失', extDirty); process.exit(1); }
          if (!FR.LEX_DETAIL || Object.keys(FR.LEX_DETAIL).length < 6000) { console.error('缺少词频/屈折数据'); process.exit(1); }
          // 每级下限，防止某一级被削到个位数还发布
          ['A1','A2','B1','B2','C1'].forEach(lv => {
            if ((FR.LEXICON[lv] || []).length < 400) { console.error(lv, '词条过少'); process.exit(1); }
          });
          // 变位形式内容校验：六项、非空、无破折号占位、无残留人称代词
          // 基础/进阶时式文件：条数一致，每条 6 个人称，不空、不占位、不残留人称代词
          const advKeys = Object.keys(FR.VERB_TENSES_ADV || {});
          if (advKeys.length !== verbs) { console.error('进阶时式条数不匹配', advKeys.length, verbs); process.exit(1); }
          const badForms = Object.entries(FR.VERB_FORMS).filter(([inf, v]) => {
            const parts = String(v).split('|');
            const pres = (parts[1] || '').split(',');
            const pc = (parts[2] || '').split(',');
            const imp = (parts[3] || '').split(',');
            return [pres, pc, imp].some(list => list.length !== 6 ||
              list.some(x => !x || /^[—–-]+$/.test(x) || /^(j|m|t|s|n|qu)'/i.test(x)));
          });
          if (badForms.length) { console.error('变位形式异常', badForms.slice(0, 3).map(x => x[0])); process.exit(1); }
          // 每条词必须有释义与例句，避免脏数据上线
          const dirty = Object.entries(FR.LEXICON).flatMap(([lv, list]) =>
            list.filter(e => !e.w || !e.p || !e.cn || !e.ex || !e.exCn).map(e => lv + ':' + e.w));
          if (dirty.length) { console.error('词条字段缺失', dirty.slice(0, 5)); process.exit(1); }
          const g = FR.GRAMMAR.length, v = FR.VERBS.length, s = FR.SCENES.length;
          console.log(`lexicon ${lx} / grammar ${g} / verbs ${v} / scenes ${s}`);
          if (lx < 6900 || g < 60 || v < 20 || s < 10) {
            console.error('语料数量异常，停止部署');
            process.exit(1);
          }
          NODE

      - name: 组装发布目录
        run: |
          set -e
          mkdir -p _site
          cp -R index.html css js data _site/
          cp NOTICE.md _site/ 2>/dev/null || true
          touch _site/.nojekyll
          du -sh _site
          find _site -maxdepth 1

      - name: 配置 Pages（首次运行自动开启，来源=GitHub Actions）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
